[package]
name = "passbundle-agent"
version = "0.1.0"
description = "The PassBundle desktop agent: a tray app with no windows"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.89"
publish = false

# Its own workspace: upstream's desktop_native crates link Bitwarden SDK crates
# that aren't under a standard open-source license, so the agent never builds
# with them. See README.md.
[workspace]

[[bin]]
name = "passbundle-agent"
path = "src/main.rs"

[dependencies]
minisign-verify = "0.3"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tao = "0.37"
tray-icon = "0.26"
# The OS's own TLS (SChannel, Security.framework) and certificate store: no C
# crypto to build, and it trusts what the machine trusts, such as an office
# firewall's root. Releases are checked by signature either way.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
minisign = "0.10"
tiny_http = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
